<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Parent Dashboard | T-HUB</title>
    <link rel="stylesheet" href="/css/parent-portal.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body class="parent-portal">
    <main class="parent-main">
      <section class="parent-welcome" aria-labelledby="parentWelcomeTitle">
        <div class="parent-profile-header-card">
          <div class="parent-profile-main">
            <span
              id="parentPhoto"
              class="parent-avatar-shell parent-avatar-large"
              aria-hidden="true"
            >
              <img class="parent-avatar" alt="" />
              <span class="parent-avatar-initials"></span>
            </span>

            <div class="parent-welcome-details">
              <span class="parent-badge">FAMILY PORTAL</span>
              <h1 id="parentWelcomeTitle">
                Welcome, <span id="parentName">Loading...</span>
              </h1>
            </div>
          </div>

          <div class="parent-profile-actions">
            <button id="parentRefresh" class="parent-refresh-button" type="button">
              <i class="fa-solid fa-rotate" aria-hidden="true"></i> Refresh
            </button>
          </div>
        </div>
      </section>
      <section class="children-section" aria-labelledby="childrenTitle">
        <div class="section-heading">
          <div>
            <h2 id="childrenTitle">Your students</h2>
            <p class="parent-subtitle">
              Choose a student to see their school information.
            </p>
          </div>
        </div>
        <div
          id="parentChildren"
          class="parent-children"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="parent-state">Loading linked students…</p>
        </div>
      </section>
    </main>

    <nav class="parent-bottom-nav" aria-label="Parent portal navigation">
      <a class="is-active" href="parent-dashboard.html" aria-current="page">
        <i class="fa-solid fa-house" aria-hidden="true"></i><span>Dashboard</span>
      </a>
      <a href="parent-academics.html">
        <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i><span>Academics</span>
      </a>
      <a href="parent-settings.html">
        <i class="fa-solid fa-gear" aria-hidden="true"></i><span>Settings</span>
      </a>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/parent-portal.js"></script>
    <script src="/js/parent-dashboard.js"></script>
    <script src="/js/app-icons.js"></script>
  </body>
</html>
