<!doctype html>
<html lang="en">
  <head>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Student information | T-HUB Family Portal</title>
    <link rel="stylesheet" href="/css/parent-portal.css" />
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="T-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="/css/app-visuals.css" />
  </head>
  <body class="parent-portal">
    <main class="parent-main parent-records-main">
      <section class="parent-welcome">
        <div class="record-student-heading">
          <span
            id="recordStudentPhoto"
            class="parent-student-avatar-shell parent-student-avatar-large"
            aria-hidden="true"
          >
            <img class="parent-student-avatar" alt="" />
            <span class="parent-student-avatar-initials"></span>
          </span>
          <div>
            <h1 id="recordStudentName">Loading student…</h1>
            <p id="recordStudentDetails">
              Checking your secure student selection…
            </p>
          </div>
        </div>
      </section>
      <section class="parent-record-panel">
        <div class="parent-record-heading">
          <div>
            <h2 id="recordViewTitle">Loading records…</h2>
          </div>
        </div>
        <div id="recordFilters" class="parent-record-filters" hidden>
          <label id="recordSchoolFilterField"
            >School<select id="recordSchoolFilter">
              <option value="">All schools</option>
            </select></label
          >
          <label id="recordYearFilterField"
            >Academic year<select id="recordYearFilter">
              <option value="">All years</option>
            </select></label
          >
          <label id="recordClassFilterField"
            >Class<select id="recordClassFilter">
              <option value="">All classes</option>
            </select></label
          >
          <label id="recordTermFilterField"
            >Semester<select id="recordTermFilter">
              <option value="">All semesters</option>
              <option value="1">1st Semester</option>
              <option value="2">2nd Semester</option>
            </select></label
          >
          <label id="recordPeriodFilterField" hidden
            >Assessment period<select id="recordPeriodFilter">
              <option value="">All assessment</option>
            </select></label
          >
          <label id="recordSubjectFilterField" hidden
            >Subject<select id="recordSubjectFilter">
              <option value="">All subjects</option>
            </select></label
          >
          <label id="recordDayFilterField" hidden
            >Day<select id="recordDayFilter">
              <option value="">All days</option>
            </select></label
          >
        </div>
        <div
          id="parentRecordsContent"
          class="parent-record-content"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="parent-state">Loading student information…</p>
        </div>
      </section>
    </main>

    <nav class="parent-bottom-nav" aria-label="Parent portal navigation">
      <a href="parent-dashboard.html">
        <i class="fa-solid fa-house" aria-hidden="true"></i><span>Dashboard</span>
      </a>
      <a href="parent-academics.html" data-parent-nav="academics">
        <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i><span>Academics</span>
      </a>
      <a href="parent-settings.html">
        <i class="fa-solid fa-gear" aria-hidden="true"></i><span>Settings</span>
      </a>
    </nav>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"
      crossorigin="anonymous"
    ></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/parent-portal.js"></script>
    <script src="/js/parent-records.js"></script>
    <script src="/js/app-icons.js"></script>
  </body>
</html>
